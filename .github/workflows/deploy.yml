name: Build and deploy

# Every push to main becomes the production deployment of the Cloudflare Pages project.
# Every pull request from this repository gets a preview deployment at <branch>.<project>.pages.dev.
# Pull requests from forks are built but not deployed (they have no access to the Cloudflare secrets).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time; a newer push cancels an in-flight run for the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # preview-URL comment on pull requests
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install wrangler (pinned in package-lock.json)
        run: npm ci --ignore-scripts

      - name: Build public/
        run: python3 build_cf.py

      - name: Decide whether to deploy
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$IS_FORK" == "true" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Fork pull request: build only, no deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Pages uses the branch name to pick production vs preview and to build the alias URL.
          branch="${HEAD_REF:-$REF_NAME}"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.plan.outputs.deploy == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets." >&2
            exit 1
          fi
          # Project name and output directory come from wrangler.toml. The build output is not committed,
          # so the tree is always dirty from git's point of view; --commit-dirty silences that warning.
          npx wrangler pages deploy \
            --branch "$BRANCH" \
            --commit-hash "$SHA" \
            --commit-dirty=true 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | head -n 1 || true)"
          alias="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | sed -n '2p' || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare Pages deployment"
            echo
            echo "- Branch: \`$BRANCH\`"
            echo "- Deployment: ${url:-unknown}"
            [[ -n "$alias" ]] && echo "- Alias: $alias"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: github.event_name == 'pull_request' && steps.plan.outputs.deploy == 'true'
        uses: actions/github-script@v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        with:
          script: |
            const marker = '<!-- fraction-quest-preview -->';
            const { DEPLOY_URL, ALIAS_URL, BRANCH } = process.env;
            const body = [
              marker,
              '### Cloudflare Pages preview',
              '',
              `Branch \`${BRANCH}\` at commit ${context.sha.slice(0, 7)}.`,
              '',
              `- Preview: ${DEPLOY_URL || '(URL not found in wrangler output; see the job summary)'}`,
              ALIAS_URL ? `- Branch alias: ${ALIAS_URL}` : null,
            ].filter(Boolean).join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
