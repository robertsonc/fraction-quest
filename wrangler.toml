# Cloudflare Pages project (static assets only, no Functions).
# The project was created with `wrangler pages project create` (direct upload), so deployments come from
# GitHub Actions (.github/workflows/deploy.yml) or ./deploy.sh, not from the Pages Git integration.
# The project is named "fraction-quest"; Cloudflare gave it the hostname fraction-quest-606.pages.dev because
# fraction-quest.pages.dev was already taken. The "-606" is part of the hostname only, not the project name.
name = "fraction-quest"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"
